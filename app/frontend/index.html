<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complainant portal</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head>
<body>
<header><div class="brand">SAPS <span>Case Docket Management</span></div><span>Complainant portal</span></header>
<main>
<p class="eyebrow">YOUR COMPLAINTS</p><h1>Report an incident.<br>Follow its progress.</h1>
<p class="intro">Submit your complaint and keep track of its status in one place.</p>
<nav aria-label="Portal"><button id="login-tab">Sign in</button><button id="register-tab">Create account</button><button id="mine-tab" hidden>My complaints</button><button id="new-tab" hidden>New complaint</button><button id="logout" hidden>Sign out</button></nav>
<p id="message" role="status" aria-live="polite"></p>
<section id="view" aria-label="Current page"></section>
<noscript>Enable JavaScript to use the complainant portal.</noscript>
</main><footer>SAPS Case Docket Management · Complainant services</footer>
</body></html>
