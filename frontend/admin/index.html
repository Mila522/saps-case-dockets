<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System administration · SAPS</title><link rel="stylesheet" href="/officer/assets/styles.css"><link rel="stylesheet" href="/investigator/assets/investigator.css"><link rel="stylesheet" href="/admin/style.css?v=navy-gold-1">
<script type="module" src="/admin/app.mjs"></script><link rel="stylesheet" href="/portal/branding.css"></head>
<body><main class="admin-shell"><header class="page-heading"><div><p class="eyebrow"><img class="saps-logo" src="/portal/saps-logo.jfif" alt="South African Police Service logo" width="72" height="72">SAPS Case Docket Management</p><h1>System administration</h1><p id="identity">Checking access…</p></div><button id="logout" class="button button-secondary" hidden>Sign out</button></header>
<p id="notice" role="status" tabindex="-1" hidden></p><div id="workspace" hidden>
<nav class="section-nav" aria-label="Administration"><button id="users-tab" class="button">User accounts</button><button id="audit-tab" class="button">Audit trail</button></nav>
<section id="users-panel"><h2>User accounts</h2><form id="user-filters" class="filters"><label>Search username or email<input name="q" maxlength="254"></label><label>Role<select name="role"></select></label><label>Station<select name="station_id"></select></label><label>Status<select name="active"><option value="">All statuses</option><option value="true">Active</option><option value="false">Inactive</option></select></label><button class="button">Search</button></form>
<button id="create-staff" class="button button-primary">Provision staff account</button><p id="user-count"></p><div id="user-list" class="table-wrap"></div><div class="actions"><button id="users-prev" class="button">Previous</button><button id="users-next" class="button">Next</button></div>
<section id="editor" class="panel" hidden></section></section>
<section id="audit-panel" hidden><h2>Read-only audit trail</h2><p>Account administration and recorded activity. Sensitive case contents and authentication data are withheld.</p><form id="audit-filters" class="form-grid"><label>From (local time)<input type="datetime-local" name="start"></label><label>To (local time)<input type="datetime-local" name="end"></label><label>Actor user UUID<input name="actor"></label><label>Action (exact)<input name="action" maxlength="100"></label><label>Record type<input name="entity_type" maxlength="100"></label><label>Affected record UUID<input name="entity_id"></label><button class="button">Search audit</button></form><p id="audit-count"></p><div id="audit-list" class="table-wrap"></div><div class="actions"><button id="audit-prev" class="button">Previous</button><button id="audit-next" class="button">Next</button></div><section id="audit-detail" class="panel" hidden></section></section>
</div></main></body></html>
